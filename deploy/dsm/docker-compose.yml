services:
  app:
    image: ${CROWDROOM_IMAGE:-crowdroom:local}
    pull_policy: never
    ports:
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-3323}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crowdroom}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-crowdroom}
    volumes:
      - avatars:/app/backend/static/avatars
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowdroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crowdroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdroom} -d ${POSTGRES_DB:-crowdroom}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  avatars:
  pgdata:
